services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tingye
      POSTGRES_USER: tingye
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tingye -d tingye"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${DOMAIN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - minio_data:/data

  app:
    build:
      context: ../../apps/web
      args:
        RELEASE_SOURCE_ORIGIN: ${RELEASE_SOURCE_ORIGIN:-https://tingye-reader.vercel.app}
    env_file:
      - .env.server
    environment:
      APP_ORIGIN: https://${DOMAIN}
      AUTH_IP_HEADER: x-tingye-client-ip
      DATABASE_URL: postgres://tingye:${POSTGRES_PASSWORD}@postgres:5432/tingye
      DATABASE_SSL: disable
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
