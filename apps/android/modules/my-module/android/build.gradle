plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tingyedocuments'
version = '0.1.0'

dependencies {
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}

android {
  namespace "expo.modules.tingyedocuments"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
