name: iPhone native React UI verification
on:
  workflow_dispatch: {}
jobs:
  simulator:
    type: build
    params:
      platform: ios
      profile: ui-verification
  native_ui:
    needs: [simulator]
    type: maestro
    params:
      build_id: ${{ needs.simulator.outputs.build_id }}
      device_identifier: iPhone 16 Pro Max
      flow_path: verification/ios-ui.yaml
      record_screen: true
      retries: 0
