name: Build mobile releases
on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build signed Android APK
        type: boolean
        default: true
      android_unsigned:
        description: Build an unsigned APK instead (no Android keystore secrets needed)
        type: boolean
        default: false
      build_ios:
        description: Build iOS IPA directly with Xcode (no EAS)
        type: boolean
        default: true
      ios_profile:
        description: unsigned needs no Apple certs (pair it with your own signing tool); adhoc/appstore codesign in CI using the IOS_* secrets
        type: choice
        options: [unsigned, adhoc, appstore]
        default: unsigned
      create_release:
        description: Attach built artifacts to a new GitHub Release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    if: ${{ inputs.build_android }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate the runner's pre-installed Android SDK
        shell: pwsh
        run: |
          if (!$env:ANDROID_HOME) { $env:ANDROID_HOME = $env:ANDROID_SDK_ROOT }
          if (!$env:ANDROID_HOME -or !(Test-Path $env:ANDROID_HOME)) { throw 'windows-latest is expected to ship a pre-installed Android SDK; ANDROID_HOME/ANDROID_SDK_ROOT was not set.' }
          $sdkmanager = Get-ChildItem -Path (Join-Path $env:ANDROID_HOME 'cmdline-tools') -Filter 'sdkmanager.bat' -Recurse -ErrorAction Stop | Select-Object -First 1
          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_HOME=$($env:ANDROID_HOME)"
          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_SDK_ROOT=$($env:ANDROID_HOME)"
          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_SDKMANAGER=$($sdkmanager.FullName)"
      - name: Install required SDK packages
        # Only the signing step (zipalign/apksigner) needs a specific build-tools
        # version; an unsigned build never touches it, and Gradle resolves its own
        # compile/build-tools needs independently, so skip it entirely when not signing.
        if: ${{ !inputs.android_unsigned }}
        shell: pwsh
        timeout-minutes: 5
        # `echo y` guards against an unexpected license re-prompt blocking forever
        # with no stdin; every package this project needs is already accepted on
        # the runner image, so this is a no-op in the common case.
        run: echo y | & $env:ANDROID_SDKMANAGER "build-tools;36.0.0" "platform-tools"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.gradle\caches
            C:\Users\runneradmin\.gradle\wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Point npm at the public registry
        shell: pwsh
        # package-lock.json pins package hosts at a mirror (registry.npmmirror.com)
        # that is unreliable from hosted runners; npm ci fetches from the exact
        # "resolved" URL in the lockfile regardless of --registry, so repoint it
        # here rather than passing a registry flag that npm would ignore.
        run: (Get-Content package-lock.json) -replace 'registry\.npmmirror\.com','registry.npmjs.org' | Set-Content package-lock.json
      - run: npm ci
        timeout-minutes: 10
      - run: npm run typecheck
        timeout-minutes: 10
      - run: npm test
        timeout-minutes: 10
      - name: Decode signing keystore
        if: ${{ !inputs.android_unsigned }}
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (!$env:ANDROID_KEYSTORE_BASE64) { throw 'Add the ANDROID_KEYSTORE_BASE64 repository secret (base64 of your release keystore) before running this workflow, or set android_unsigned to build an unsigned APK instead.' }
          $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          $path = Join-Path $env:RUNNER_TEMP 'release.keystore'
          [IO.File]::WriteAllBytes($path, $bytes)
          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_KEYSTORE_PATH=$path"
      - name: Build signed APK
        if: ${{ !inputs.android_unsigned }}
        shell: pwsh
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run build:apk
        # A cold Gradle build with no cache hit compiles several native (CMake)
        # modules for three ABIs each and has genuinely taken over 35 minutes on
        # this runner pool; give it real headroom rather than killing a build
        # that is still making progress.
        timeout-minutes: 90
      - name: Build unsigned APK
        if: ${{ inputs.android_unsigned }}
        shell: pwsh
        # No overwrite-install guarantee: an unsigned APK can never replace an
        # existing signed install of this app and is for local testing only.
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/build-local.ps1 -Unsigned
          New-Item -ItemType Directory -Force releases | Out-Null
          Copy-Item android/app/build/outputs/apk/release/app-release-unsigned.apk releases/app-unsigned.apk
        timeout-minutes: 90
      - name: Checksum
        shell: pwsh
        working-directory: apps/android/releases
        run: Get-FileHash *.apk -Algorithm SHA256 | Format-List | Tee-Object -FilePath sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            apps/android/releases/*.apk
            apps/android/releases/sha256.txt
  ios:
    if: ${{ inputs.build_ios }}
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/ios/package-lock.json
      - name: Point npm at the public registry
        # See the matching step in the android job: npm ci fetches from the
        # lockfile's "resolved" host regardless of --registry.
        run: sed -i '' 's#registry\.npmmirror\.com#registry.npmjs.org#g' package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Select native build entry
        # Replicates the eas-build-post-install hook this project used under EAS:
        # picks the real app entry (not the simulator-only verification fixture)
        # and patches expo-audio's iOS clock bug in node_modules before CocoaPods
        # reads it, so this must run before `expo prebuild`.
        run: node tools/select-build-entry.cjs
      - name: Generate native iOS project
        # apps/ios has no checked-in ios/ directory (see .gitignore); it is
        # regenerated fresh from app.json + config plugins on every build, same
        # as EAS did internally. `expo prebuild` also runs `pod install`.
        run: npx expo prebuild --platform ios
      - name: Import signing certificate and provisioning profile
        if: ${{ inputs.ios_profile != 'unsigned' }}
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_DISTRIBUTION_CERTIFICATE_BASE64:-}" ] || [ -z "${IOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo 'Add IOS_DISTRIBUTION_CERTIFICATE_BASE64, IOS_PROVISIONING_PROFILE_BASE64 and IOS_DISTRIBUTION_CERTIFICATE_PASSWORD repository secrets before running this workflow, or set ios_profile to unsigned.' >&2
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          PROFILE_NAME=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          TEAM_ID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract TeamIdentifier.0 xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "TEAM_ID=$TEAM_ID"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"
      - name: Archive (signed)
        if: ${{ inputs.ios_profile != 'unsigned' }}
        run: |
          xcodebuild -workspace ios/app.xcworkspace -scheme app -configuration Release \
            -archivePath "$RUNNER_TEMP/app.xcarchive" -destination "generic/platform=iOS" \
            -allowProvisioningUpdates CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="$PROFILE_UUID" DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            archive
      - name: Export signed IPA
        if: ${{ inputs.ios_profile != 'unsigned' }}
        run: |
          METHOD=${{ inputs.ios_profile == 'appstore' && 'app-store' || 'ad-hoc' }}
          mkdir -p releases
          cat > "$RUNNER_TEMP/exportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.shatianrui.wereader</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" -exportPath releases -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"
      - name: Archive and package unsigned IPA
        if: ${{ inputs.ios_profile == 'unsigned' }}
        # No Apple cert/profile needed. The .app is unsigned and cannot install
        # on a device as-is; the person running this build re-signs the ipa with
        # their own signing tool (e.g. Sideloadly/AltStore/TrollStore) before install.
        run: |
          xcodebuild -workspace ios/app.xcworkspace -scheme app -configuration Release \
            -archivePath "$RUNNER_TEMP/app.xcarchive" -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
          mkdir -p releases/Payload
          cp -R "$RUNNER_TEMP/app.xcarchive/Products/Applications/app.app" releases/Payload/
          # zip -y and macOS extra fields (0x7875) make Windows Explorer report the
          # archive as invalid ("无法打开压缩文件夹"). -X strips those fields; do not
          # store symlinks. Payload must stay at the archive root.
          (cd releases && zip -r -X app-unsigned.ipa Payload)
          unzip -tqq releases/app-unsigned.ipa
          rm -rf releases/Payload
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision"
      - name: Resolve IPA path
        id: ipa
        run: |
          set -euo pipefail
          # macOS runners ship bash 3.2 (no `mapfile`, added in bash 4); build the
          # array with a read loop instead so this works there.
          ipas=()
          while IFS= read -r file; do
            ipas+=("$file")
          done < <(find releases -maxdepth 1 -type f -name '*.ipa' | sort)
          if [ "${#ipas[@]}" -ne 1 ]; then
            echo "Expected exactly one IPA in releases/, found ${#ipas[@]}" >&2
            # bash 3.2 (macOS) treats "${ipas[@]}" on a truly empty array as an
            # unbound variable under `set -u`, so only expand it when non-empty.
            if [ "${#ipas[@]}" -gt 0 ]; then printf '%s\n' "${ipas[@]}" >&2; fi
            exit 1
          fi
          echo "path=apps/ios/${ipas[0]}" >> "$GITHUB_OUTPUT"
      # archive: false uploads the IPA bytes directly. The default artifact zip is
      # a second archive (data-descriptor deflate) around an already-zipped IPA;
      # Windows Explorer reports that download as a corrupt compressed file.
      # Artifact name becomes the IPA filename; the name input is ignored.
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: ${{ steps.ipa.outputs.path }}
          archive: false
          if-no-files-found: error
  release:
    needs: [android, ios]
    if: >-
      ${{ !cancelled() && inputs.create_release &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v8 skips unzip when the artifact is a raw file (iOS archive: false).
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-${{ github.run_number }}
          name: Mobile build ${{ github.run_number }}
          files: dist/**/*
